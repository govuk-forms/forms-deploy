repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: &exclude_from_whitespace |
          (?x)^(
              infra/modules/cloudfront/html/assets/.*$|
              support/pipeline-visualiser/public/.*$
          )$
      - id: end-of-file-fixer
        exclude: *exclude_from_whitespace
      - id: check-added-large-files
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: check-executables-have-shebangs
      - id: check-symlinks
      - id: destroyed-symlinks
  - repo: local
    hooks:
      - id: terraform-fmt
        name: terraform fmt
        entry: ./pre-commit-tf-fmt.sh
        language: system
        files: ^infra/
        pass_filenames: true
        types_or:
          - terraform

      - id: tflint
        name: tflint
        require_serial: true
        types_or:
          - hcl
          - terraform
        language: golang
        # Keep in step with the tflint pin in .mise.toml.
        # TODO: add a guardrail for keeping versions in sync
        additional_dependencies:
          - github.com/terraform-linters/tflint@v0.64.0
        files: ^(infra/|\.tflint\.hcl$)
        pass_filenames: true
        entry: ./support/run-tflint.sh

      - id: checkov
        name: checkov
        entry: ./support/run-checkov.sh
        language: python
        # Keep in step with the checkov pin in .mise.toml.
        # TODO: add a guardrail for keeping versions in sync
        additional_dependencies:
          - checkov==3.2.470
        require_serial: true
        files: ^infra/(checkov/|.*\.(tf|tfvars|hcl)$)
        pass_filenames: true

      - id: rubocop
        name: lint ruby
        types:
          - ruby
        language: system
        entry: bundle exec rubocop --force-exclusion

  # Keep in step with the jactionlint pins in .mise.toml and
  # .github/workflows/reusable-lint-workflows.yml.
  # TODO: add a guardrail for keeping versions in sync
  - repo: https://github.com/jdx/jactionlint
    rev: v2.4.0
    hooks:
      - id: jactionlint
