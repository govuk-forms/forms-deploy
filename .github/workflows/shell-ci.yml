name: "Shell script CI"
on:
  pull_request:
  merge_group:
    types: [checks_requested]
jobs:
  shell-ci:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    name: Shell
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint shell scripts
        run: |
          # we don't have non-alpha-numeric file names
          # shellcheck disable=SC2038
          find . -type f \
            -name "*.sh" \
            -not \
              -path "*/.terraform/*" \
          | xargs -L1 shellcheck

      - name: Lint shell scripts in CodeBuild build specs
        run: |
          ./support/shellcheck_codebuild.sh

      - name: Test the CI digest script
        run: |
          ./support/ci-digest/ci-digest.test.sh
