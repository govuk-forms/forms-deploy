name: "Ruby CI"
on:
  pull_request:
    branches: [main]
    paths:
      - "**.rb"
      - "**Gemfile"
      - "**Rakefile"
      - ".github/workflows/ruby-ci.yml"
      - "infra/**"
      - ".mise.toml"
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  setup:
    name: "Setup"
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    outputs:
      ruby-version: ${{ steps.set-ruby-version.outputs.ruby-version }}
      spec-matrix: ${{ steps.build-matrix.outputs.spec-matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialise mise and cache `hcl2json`
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: hcl2json

      - name: Set Ruby version
        id: set-ruby-version
        run: |
          echo "ruby-version=$(mise current ruby)" >> "$GITHUB_OUTPUT"

      - name: Build spec matrix
        id: build-matrix
        run: |
          spec_dirs_json="$(find . -type d -name 'spec' -not -path '*vendor*' | sed 's|/spec$||g' | jq -Rnc '[inputs]')"
          echo "spec-matrix=$spec_dirs_json" >> "$GITHUB_OUTPUT"

  ruby-lint:
    name: "Ruby Lint"
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    needs: setup
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Ruby and gems at root
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          bundler-cache: true
          ruby-version: ${{needs.setup.outputs.ruby-version}}
      - name: Run rubocop
        run: make lint_ruby

  ruby-spec:
    name: "Rspec"
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        spec_target: ${{ fromJSON(needs.setup.outputs.spec-matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up hcl2json
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: hcl2json

      - name: "Install Ruby and gems in ${{matrix.spec_target}}"
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          bundler-cache: true
          ruby-version: ${{needs.setup.outputs.ruby-version}}
          working-directory: "${{matrix.spec_target}}"

      - name: Run specs
        run: |
          cd "${{matrix.spec_target}}"
          bundle exec rspec
