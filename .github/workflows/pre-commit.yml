name: pre-commit
on:
  pull_request:
  push:
    branches:
      - main
  merge_group:

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pre-commit:
    # Runs on pull requests, in the merge queue and on pushes to main. The queue
    # checks a change as it will land, with whatever is ahead of it in the queue,
    # and a push to main also keeps pre-commit's cache up to date.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Required, for 'required PR status checks' on GitHub, so the name has to stay.
    # It runs on every event, so a failure here fails the required check itself.
    name: Run pre-commit
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: 📦 Check Out Repository Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: 🏗️ Install Pre-commit
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          github_token: ${{ secrets.MISE_PAT }} # As this is a private repo, we can get API rate limit issues. Use a PAT to avoid this. (The token needs no special permissions.)
          install_args: pre-commit
      - name: 📦 Cache Pre-commit tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-3|${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-3|
      - name: ✅ Run Pre-commit Hooks
        id: pre-commit
        env:
          SKIP: "checkov,tflint,rubocop,terraform-fmt,jactionlint"
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          MERGE_GROUP_HEAD: ${{ github.event.merge_group.head_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          # The commits to compare depend on the event: a pull request's base and
          # head, the merge queue's own, or the commit before and after a push.
          case "${EVENT}" in
            pull_request)
              from="${PR_BASE}"
              to="${PR_HEAD}"
              ;;
            merge_group)
              from="${MERGE_GROUP_BASE}"
              to="${MERGE_GROUP_HEAD}"
              ;;
            *)
              from="${PUSH_BEFORE}"
              to="${PUSH_AFTER}"
              ;;
          esac

          # A new branch has a before of all zeros, and a force push can leave one
          # that isn't in the history. Then the changes can't be worked out, so
          # check every file, which is safer than guessing from the last commit.
          if git cat-file -e "${from}^{commit}" 2> /dev/null; then
            echo "Comparing ${from} with ${to}"
            range=(--from-ref "${from}" --to-ref "${to}")
          else
            echo "Can't find ${from}, so checking every file"
            range=(--all-files)
          fi

          pre-commit run --show-diff-on-failure --color=never "${range[@]}" \
          | tee result.out; test "${PIPESTATUS[0]}" -eq 0
        shell: bash

      - name: 📄 Parse pre-commit output and manage PR comment
        if: always() && github.event_name == 'pull_request'
        env:
          COMMENT_MARKER: "<!-- pre-commit-comment -->"
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ steps.pre-commit.outcome }}
          WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # shellcheck disable=SC2016
          # Check if the pre-commit job failed
          if [ "$JOB_STATUS" = "failure" ]; then
            # Parse the output to extract failed checks
            echo "Parsing pre-commit output for failed checks..."

            # Create the comment body file with marker expansion
            cat > "${{runner.temp}}/pr-comment.md" <<EOF
          ${COMMENT_MARKER}

          <h3>Pre-Commit report</h3>

          This pull request had errors when running pre-commit.

          [View workflow run →](${WORKFLOW_RUN_URL})

          EOF

            # Extract failed checks and their details into a single code block
            # Look for lines ending with "Failed" and capture them plus following lines starting with "-"
            {
              echo '```'
              awk '
              /Failed$/ {
                # Start of a failed check
                if (buffer != "") {
                  # Print previous buffer with blank line separator
                  print buffer
                  print ""
                }
                buffer = $0
                in_failed = 1
                next
              }
              in_failed && /^- / {
                # Lines starting with "- " are details of the failed check
                buffer = buffer "\n" $0
                next
              }
              in_failed && !/^- / {
                # Any line not starting with "- " ends the current failed check
                in_failed = 0
              }
              END {
                # Print final buffer if exists
                if (buffer != "") {
                  print buffer
                }
              }
              ' result.out
              echo '```'
            } >> "${{runner.temp}}/pr-comment.md"

            # Add footer with diff section
            {
              cat <<'EOF'

          Reproduce locally with: `pre-commit run --all-files`.<br/>
          To run `pre-commit` as part of git workflow, use `pre-commit install`.

          <details >
            <summary>Full diff of automatic changes</summary>
            <br/>

          ```diff
          EOF
              # Extract the diff section if it exists (everything after "All changes made by hooks:")
              sed -n '/^All changes made by hooks:/,$p' result.out | tail -n +2
              cat <<'EOF'
          ```

          </details>

          <hr/>

          <sub>
            This comment will be updated when code changes.
          </sub>
          EOF
            } >> "${{runner.temp}}/pr-comment.md"

            # Find and update or create comment
            old_comment_ids=$(gh api "repos/{owner}/{repo}/issues/${{github.event.pull_request.number}}/comments" --jq 'map(select((.user.login == "github-actions[bot]") and (.body | startswith($ENV.COMMENT_MARKER)))) | .[].id')

            if [ -n "$old_comment_ids" ]; then
              # Update existing comment
              comment_id=$(echo "$old_comment_ids" | head -n1)
              gh api -X PATCH "repos/{owner}/{repo}/issues/comments/${comment_id}" \
                -F body=@"${{runner.temp}}/pr-comment.md"
              echo "Updated existing comment: $comment_id"
            else
              # Create new comment
              gh pr comment "${{github.event.pull_request.html_url}}" --body-file "${{runner.temp}}/pr-comment.md"
              echo "Created new comment"
            fi
          else
            # Pre-commit passed - check if there's an existing comment to update
            old_comment_ids=$(gh api "repos/{owner}/{repo}/issues/${{github.event.pull_request.number}}/comments" --jq 'map(select((.user.login == "github-actions[bot]") and (.body | startswith($ENV.COMMENT_MARKER)))) | .[].id')

            if [ -n "$old_comment_ids" ]; then
              # Update the comment to say it's fixed
              comment_id=$(echo "$old_comment_ids" | head -n1)
              cat > "${{runner.temp}}/pr-comment-fixed.md" <<EOF
          ${COMMENT_MARKER}

          <h3>Pre-Commit report</h3>

          ✅ All pre-commit checks are now passing!

          <hr/>

          <sub>
            This comment will be updated when code changes.
          </sub>
          EOF
              gh api -X PATCH "repos/{owner}/{repo}/issues/comments/${comment_id}" \
                -F body=@"${{runner.temp}}/pr-comment-fixed.md"
              echo "Updated comment to show checks are passing"
            else
              echo "No existing comment to update, and checks passed - nothing to do"
            fi
          fi
      - name: 🧹 Cache Cleanup
        if: always() # always run to ensure cache is cleaned up even if previous steps fail
        run: pre-commit gc
        shell: bash
