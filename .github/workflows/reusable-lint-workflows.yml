name: "Lint Workflows"

on:
  workflow_call:
    inputs:
      profile:
        description: The rule profile to use when the repository has no .github/jactionlint.yaml or .github/jactionlint.yml
        type: string
        default: correctness

env:
  # Not the version of the action, which is updated separately. Keep it in
  # step with the jactionlint pins in .mise.toml and .pre-commit-config.yaml.
  JACTIONLINT_VERSION: "2.4.0"

jobs:
  jactionlint:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check workflow files
        # This runs in the calling repository, so its own
        # .github/jactionlint.yaml or .yml decides the profile. Passing a
        # profile overrides the file, so the input is only passed when there
        # is none.
        uses: jdx/jactionlint@baa8d685e2b27ff5821558c9eeabb2051c1da61b # v2.4.0
        with:
          version: ${{ env.JACTIONLINT_VERSION }}
          profile: ${{ hashFiles('.github/jactionlint.yaml', '.github/jactionlint.yml') == '' && inputs.profile || '' }}
          strict-exit: true
          online: false

  timeouts:
    name: Check jobs have a timeout
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check jobs have a timeout
        # Without timeout-minutes, a hung job runs for up to 6 hours before
        # GitHub fails it. Jobs that call a reusable workflow cannot set one.
        run: |
          status=0
          for file in .github/workflows/*.y*ml; do
            missing="$(yq '.jobs | to_entries | .[] | select(.value."runs-on" != null and .value."timeout-minutes" == null) | .key' "$file")"
            for job in $missing; do
              echo "::error file=${file}::Job '${job}' has no timeout-minutes"
              status=1
            done
          done
          exit "$status"
        shell: bash
