name: "Lint Workflows"

on:
  workflow_call:
    inputs:
      profile:
        description: The rule profile to use when the repository has no .github/jactionlint.yaml or .github/jactionlint.yml
        type: string
        default: correctness

env:
  # Not the version of the action, which is updated separately. Keep it in
  # step with the jactionlint pins in .mise.toml and .pre-commit-config.yaml.
  JACTIONLINT_VERSION: "2.6.0"

permissions:
  contents: read

jobs:
  jactionlint:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Write the shared rules
        id: shared
        if: hashFiles('.github/jactionlint.yaml', '.github/jactionlint.yml') == ''
        env:
          PROFILE: ${{ inputs.profile }}
        # Repositories without their own config get the profile they asked
        # for plus the two policy rules that every repository must pass,
        # whatever profile it runs. Our own reusable workflows are called
        # at @main, so they are exempt from pinning.
        run: |
          {
            echo "profile: ${PROFILE}"
            echo "rules:"
            echo "  missing-timeout: error"
            echo "  unpinned-uses:"
            echo "    level: error"
            echo "    policies:"
            echo "      govuk-forms/forms-deploy: any"
          } > "${RUNNER_TEMP}/jactionlint.yaml"
          echo "config=${RUNNER_TEMP}/jactionlint.yaml" >> "$GITHUB_OUTPUT"
      - name: Check workflow files
        # This runs in the calling repository, so its own
        # .github/jactionlint.yaml or .yml decides the rules. Without one,
        # the file written above applies.
        uses: jdx/jactionlint@72c00452809bcca05b8bc12acdcf15dd7a9c1c5e # v2.6.0
        with:
          version: ${{ env.JACTIONLINT_VERSION }}
          config-file: ${{ steps.shared.outputs.config }}
          strict-exit: true
          online: false
