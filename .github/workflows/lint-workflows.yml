name: "Lint Workflows"

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/*.yml'
      - '.github/workflows/*.yaml'
      - '.github/dependabot.yml'
      - '.github/dependabot.yaml'
      - '**/action.yml'
      - '**/action.yaml'
      - '.github/jactionlint.yaml'
      - '.github/jactionlint.yml'
  merge_group:

permissions: {}

jobs:
  lint-workflows:
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-lint-workflows.yml
