name: Ensure actions are pinned to SHAs
on:
  workflow_call:
  pull_request:
    paths:
      - ".github/workflows/**.yml"
      - ".github/workflows/**.yaml"

jobs:
  check-actions-sha:
    name: Check actions are pinned to SHAs
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Grab the last 75 commits.
          fetch-depth: 75

      - name: Find changed workflow files
        id: changed-files
        env:
          GIT_FROM: ${{ github.event.pull_request.base.sha }}
          GIT_TO: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          changed_files=$(git diff "${GIT_FROM}"..."${GIT_TO}" --name-only -- ".github/workflows/*.yml" ".github/workflows/*.yaml")

          if [[ -z "${changed_files}" ]]; then
            echo "No workflow files changed."
          else
            echo "Workflow files changed in this PR (these will be checked for pinning):"
            echo "  - ${changed_files//$'\n'/$'\n  - '}"
          fi

          {
            echo "files<<EOF"
            echo "${changed_files}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Ensure SHA pinned actions
        if: steps.changed-files.outputs.files != ''
        env:
          CHANGED_FILES: ${{ steps.changed-files.outputs.files }}
          # Owner/repo (or owner) prefixes allowed to reference actions/workflows
          # without pinning to a full commit SHA (e.g. so they can use `@main`).
          ALLOWLIST: |
            govuk-forms/forms-deploy
        run: |
          set -euo pipefail

          is_allowed() {
            local action="$1" entry
            while IFS= read -r entry; do
              [[ -z "${entry}" ]] && continue
              if [[ "${action}" == "${entry}" || "${action}" == "${entry}"/* ]]; then
                return 0
              fi
            done <<< "${ALLOWLIST}"
            return 1
          }

          failures=0

          while IFS= read -r file; do
            [[ -f "${file}" ]] || continue # skip deleted files

            while IFS=$'\t' read -r line uses; do
              [[ -z "${uses}" ]] && continue

              action="${uses%@*}"
              ref="${uses##*@}"

              # Local actions/workflows (./path@...) aren't pinned by a ref
              [[ "${action}" == ./* ]] && continue

              if is_allowed "${action}"; then
                continue
              fi

              if [[ ! "${ref}" =~ ^[0-9a-f]{40}$ ]]; then
                echo "::error file=${file},line=${line},title=Unpinned GitHub Action::'${uses}' is not pinned to a full-length commit SHA. Pin it, e.g. '${action}@<sha> # ${ref}'."
                failures=$((failures + 1))
              fi
            done < <(yq '.. | select(has("uses")) | .uses | [line, .] | @tsv' "${file}")
          done <<< "${CHANGED_FILES}"

          if [[ "${failures}" -gt 0 ]]; then
            echo "❌ Found ${failures} action(s) not pinned to a commit SHA in changed workflow files."
            exit 1
          fi

          echo "✅ All actions in changed workflow files are pinned to a commit SHA"
