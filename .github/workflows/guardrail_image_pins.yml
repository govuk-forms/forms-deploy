name: "Guardrail: Mirrored container images"

on:
  pull_request:
    branches: [main]
  # A required check has to report on the merge queue's commit as well.
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image_pins:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: read

    name: Mirrored images are on ECR and match Docker Hub
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the image pins
        run: ./support/check-image-pins.sh
