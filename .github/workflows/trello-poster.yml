name: Trello Poster
on:
  workflow_call:
    secrets:
      TRELLO_API_TOKEN:
        required: true
      TRELLO_API_KEY:
        required: true
  pull_request:
    types: [opened, edited]
jobs:
  trello-poster:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: lfdebrux/trello-poster-action@b37b5c112f8d22338922dd1e226709de7f9bd5af # v1.4.0
        with:
          comment-body: ${{ github.event.pull_request.body }}
          github-url: ${{ github.event.pull_request.html_url }}
          trello-api-token: ${{ secrets.TRELLO_API_TOKEN }}
          trello-api-key: ${{ secrets.TRELLO_API_KEY }}
