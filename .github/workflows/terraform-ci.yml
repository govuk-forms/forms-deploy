name: "Terraform CI"
on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  setup:
    name: "Setup and build matrix"
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    outputs:
      validation-matrix: ${{ steps.build-matrix.outputs.validation-matrix }}
      has-terraform-changes: ${{ steps.check-changes.outputs.has-changes }}
      has-lint-tool-changes: ${{ steps.check-lint-tools.outputs.has-changes }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Grab the last 75 commits. Later on we need to a git diff, and it's
          # very likely that two commits involved will be inside the last 75
          fetch-depth: 75

      - name: Initialise mise
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          github_token: ${{ secrets.MISE_PAT }} # As this is a private repo, we can get API rate limit issues. Use a PAT to avoid this. (The token needs no special permissions.)
          install_args: go go:github.com/hashicorp/terraform-config-inspect

      # The commits to compare depend on the event. A pull request has a base and
      # a head. The merge queue has its own, and a push to main has the commit
      # before it and the one after. Without this the SHAs are empty outside a
      # pull request, the diff is HEAD against itself and every job below is
      # skipped.
      - name: Work out the commits to compare
        id: range
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          MERGE_GROUP_HEAD: ${{ github.event.merge_group.head_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -e -u -o pipefail
          case "${EVENT}" in
            pull_request)
              from="${PR_BASE}"
              to="${PR_HEAD}"
              ;;
            merge_group)
              from="${MERGE_GROUP_BASE}"
              to="${MERGE_GROUP_HEAD}"
              ;;
            *)
              from="${PUSH_BEFORE}"
              to="${PUSH_AFTER}"
              ;;
          esac

          # A new branch has a before of all zeros, and a force push can leave
          # one that isn't in the history we fetched. Compare with the parent.
          if ! git cat-file -e "${from}^{commit}" 2> /dev/null; then
            from="${to}~1"
          fi

          echo "Comparing ${from} with ${to}"
          echo "from=${from}" >> "$GITHUB_OUTPUT"
          echo "to=${to}" >> "$GITHUB_OUTPUT"

      - name: Check for Terraform changes
        id: check-changes
        env:
          GIT_FROM: ${{ steps.range.outputs.from }}
          GIT_TO: ${{ steps.range.outputs.to }}
        run: |
          set -e -u -o pipefail
          if [[ $(git diff "${GIT_FROM}"..."${GIT_TO}" --name-only -- "*.tf" "*.tf.json" | wc -l) -eq 0 ]]; then
            echo "No Terraform files have changed."
            echo "has-changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "Terraform files have changed."
            echo "has-changes=true" >> "$GITHUB_OUTPUT"
          fi

      # Checkov and tflint scan all of infra/ whatever changed, so a new version
      # of either, or a change to a check or its config, has to run them too.
      - name: Check for linter changes
        id: check-lint-tools
        env:
          GIT_FROM: ${{ steps.range.outputs.from }}
          GIT_TO: ${{ steps.range.outputs.to }}
        run: |
          set -e -u -o pipefail
          if [[ $(git diff "${GIT_FROM}"..."${GIT_TO}" --name-only -- \
            .mise.toml .tflint.hcl infra/checkov support/run-checkov.sh support/run-tflint.sh \
            .github/workflows/terraform-ci.yml | wc -l) -eq 0 ]]; then
            echo "has-changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "The linters or their configuration have changed."
            echo "has-changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build validation matrix
        id: build-matrix
        if: steps.check-changes.outputs.has-changes == 'true'
        env:
          GIT_FROM: ${{ steps.range.outputs.from }}
          GIT_TO: ${{ steps.range.outputs.to }}
        run: |
          set -e -u -o pipefail

          # Get modified directories
          git diff "${GIT_FROM}"..."${GIT_TO}" --name-only -- "*.tf" "*.tf.json" \
          | xargs dirname \
          | sort \
          | uniq \
          > modified-tf-dirs.txt

          # Find all roots
          all_roots=$(find infra/deployments -type d \
            -mindepth 1 -maxdepth 2 \
            -not -path "*/tfvars" \
            -not -path "infra/deployments/forms" \
            -not -path "infra/deployments/deploy" \
            -not -path "infra/deployments/integration"
          )

          # Build dependency graph and determine which roots need validation
          validation_dirs=()
          for start in ${all_roots}; do
            echo "Inspecting ${start}"
            stack=("${start}")
            visited=()

            while [[ "${#stack[@]}" -gt 0 ]]; do

              path="${stack[0]}"
              stack=("${stack[@]:1}") # Shift the front element off

              # shellcheck disable=SC2199
              # shellcheck disable=SC2076
              if [[ "${visited[@]}" =~ "${path}" ]]; then
                # Skip because it's already been visited
                continue
              fi

              visited+=("${path}")

              declare -a new_paths
              readarray -t new_paths < <(terraform-config-inspect --json "${path}" \
                | jq -r '.module_calls | to_entries | .[] | .value.source' \
                | sort \
                | uniq \
                | xargs -I{} readlink -f "${path}/{}" \
                | xargs -I{} realpath --relative-to "$(pwd)" "{}" \
                | sort
              )

              if [[ "${#new_paths[@]}" -gt 0 ]]; then
                stack+=( "${stack[@]}" "${new_paths[@]}" )
              fi
            done

            printf '%s\n' "${visited[@]}" | sort | uniq > "${start}/directories.txt"

            matching_lines="$(comm -1 -2 modified-tf-dirs.txt "${start}/directories.txt")"

            if [[ -n "$matching_lines" ]]; then
              echo "✓ ${start} requires validation"
              validation_dirs+=("${start}")
            else
              echo "✗ ${start} does not require validation"
            fi
          done

          # Convert to JSON array for matrix
          if [[ "${#validation_dirs[@]}" -gt 0 ]]; then
            validation_matrix=$(printf '%s\n' "${validation_dirs[@]}" | jq -Rnc '[inputs]')
            echo "validation-matrix=${validation_matrix}" >> "$GITHUB_OUTPUT"
            echo "Matrix: ${validation_matrix}"
          else
            echo "validation-matrix=[]" >> "$GITHUB_OUTPUT"
            echo "No directories require validation"
          fi

  terraform-fmt:
    name: "Terraform format check"
    needs: setup
    if: needs.setup.outputs.has-terraform-changes == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialise mise
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          github_token: ${{ secrets.MISE_PAT }}
          install_args: terraform

      - name: Check Terraform style
        run: |
          terraform fmt -write=false -diff=true -list=true -recursive -check

  terraform-validate:
    name: "Terraform validate"
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    needs: setup
    if: needs.setup.outputs.has-terraform-changes == 'true' && needs.setup.outputs.validation-matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        directory: ${{ fromJSON(needs.setup.outputs.validation-matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialise mise
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          github_token: ${{ secrets.MISE_PAT }}
          install_args: terraform

      - name: Validate ${{ matrix.directory }}
        env:
          TF_PLUGIN_CACHE_DIR: "${{ runner.temp }}/terraform_cache"
        run: |
          set -e -u -o pipefail
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          echo "Validating ${{ matrix.directory }}"
          terraform -chdir="${{ matrix.directory }}" init -backend=false
          terraform -chdir="${{ matrix.directory }}" validate

  tflint:
    name: "tflint"
    needs: setup
    if: needs.setup.outputs.has-terraform-changes == 'true' || needs.setup.outputs.has-lint-tool-changes == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialise mise
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          github_token: ${{ secrets.MISE_PAT }}
          install_args: tflint

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        name: Cache tflint plugin dir
        with:
          path: ~/.tflint.d/plugins
          key: tflint-${{ runner.arch }}-${{ runner.os }}-${{ hashFiles('.tflint.hcl') }}
          restore-keys: |
            tflint-${{ runner.arch }}-${{ runner.os }}-

      - name: Init tflint
        run: tflint --init
        env:
          # https://github.com/terraform-linters/tflint/blob/master/docs/user-guide/plugins.md#avoiding-rate-limiting
          GITHUB_TOKEN: ${{ github.token }}

      - name: Run tflint
        run: |
          make tflint

  checkov:
    name: "Checkov"
    needs: setup
    if: needs.setup.outputs.has-terraform-changes == 'true' || needs.setup.outputs.has-lint-tool-changes == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialise mise
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          github_token: ${{ secrets.MISE_PAT }}
          install_args: pipx:checkov

      - name: Run Checkov against Terraform
        run: |
          ./support/run-checkov.sh

  report:
    # Required, for 'required PR status checks' on GitHub.
    name: "Run terraform tests"
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    needs: [terraform-fmt, terraform-validate, tflint, checkov]
    if: ${{ always() && !failure() && !cancelled() }}
    steps:
      - name: No checks failed
        run: echo "No terraform issues found."
